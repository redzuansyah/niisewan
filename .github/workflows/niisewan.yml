name: Deploy Spring Boot App to Local Windows 11

on:
  push:
    branches:
      - a-branch-that-does-not-exist  # Dummy branch to force UI registration without auto-runs
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sync Git Code Repo
        shell: cmd
        env:
            GITHUB_ACTIONS_RUNNER_TLS_NO_VERIFY: "1"
            NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          cd /d "C:\springboot-wan\niisewan"
          if not exist .git (
              git config --global --add safe.directory C:/springboot-wan/niisewan
              git init
              git remote add origin https://github.com
              git fetch origin main
              git checkout -b main origin/main
          ) else (
              git config --global --add safe.directory C:/springboot-wan/niisewan
              git checkout main
              git fetch origin main
              git reset --hard origin/main
          )

      - name: Set Up Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot Application
        shell: cmd
        run: |
          cd /d "C:\springboot-wan\niisewan"
          call mvnw.cmd clean package -DskipTests

      - name: Deliver Executable Artifact to Deployment Folder
        shell: cmd
        run: |
          if not exist "C:\RajWork\2026\JIM\SpringBoot\deploy-bin" (
              mkdir "C:\RajWork\2026\JIM\SpringBoot\deploy-bin"
          )
          echo Copying production artifact...
          copy /Y "C:\springboot-wan\niisewan\target\*.jar" "C:\RajWork\2026\JIM\SpringBoot\deploy-bin\" "C:\Niise-deployment"

      - name: Automatically Start Spring Boot Application
        shell: cmd
        run: |
          cd /d "C:\Niise-deployment"
          echo Starting the new application version in the background...
          for %%i in (*.jar) do start /B javaw -jar "%%i"